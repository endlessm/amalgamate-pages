name: Amalgamate Pages
description: Amalgamate builds from many branches into one GitHub Pages site
inputs:
  workflow_name:
    description: Name of the workflow that produces artifacts for each branch
    required: true
  artifact_name:
    description: Name of the artifact produced by the workflow
    required: true
  comment:
    description: Whether to comment on pull requests with a link to the branch's build
    required: false
    default: 'true'
  comment_template:
    description: >-
      Jinja2 template for the Markdown body of pull request comments, where
      `url` is the link to the branch's build, or empty once the build is no
      longer available. Defaults to a comment about playing a game.
    required: false
    default: ''
  branches_title:
    description: >-
      Heading of the branch index page, followed by "from" and a link to the
      repository
    required: false
    default: Playable branches
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v10.3.3
      with:
        cache-dependency-glob: |
          ${{ github.action_path }}/pyproject.toml
          ${{ github.action_path }}/uv.lock
        ignore-empty-workdir: true
        working-directory: "${{ github.action_path }}"

    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Assemble site from all live branches
      id: assemble
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        uv run --frozen godoctopus.py amalgamate
      env:
        DEBUG: ${{ runner.debug }}
        GITHUB_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        WORKFLOW_NAME: ${{ inputs.workflow_name }}
        ARTIFACT_NAME: ${{ inputs.artifact_name }}
        BRANCHES_TITLE: ${{ inputs.branches_title }}
        WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    - name: Upload pages artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: ${{ steps.assemble.outputs.path }}

    - name: Deploy to GitHub Pages
      uses: actions/deploy-pages@v5

    - name: Update build statuses
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        uv run --frozen godoctopus.py update-status
      env:
        DEBUG: ${{ runner.debug }}
        GITHUB_TOKEN: ${{ github.token }}
        COMMENT: ${{ inputs.comment }}
        COMMENT_TEMPLATE: ${{ inputs.comment_template }}

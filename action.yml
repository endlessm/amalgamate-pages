name: Amalgamate Pages
description: Amalgamate builds from many branches into one GitHub Pages site
inputs:
  workflow_name:
    description: Name of the workflow that produces artifacts for each branch
    required: true
  artifact_name:
    description: Name of the artifact produced by the workflow
    required: true
  comment:
    description: Whether to comment on pull requests with a link to the branch's build
    required: false
    default: 'true'
  comment_template:
    description: >-
      Jinja2 template for the Markdown body of pull request comments, where
      `url` is the link to the branch's build, or empty once the build is no
      longer available. Defaults to a comment about playing a game.
    required: false
    default: ''
  branches_title:
    description: >-
      Heading of the branch index page, followed by "from" and a link to the
      repository
    required: false
    default: Playable branches
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v10.4.0
      with:
        cache-dependency-glob: |
          ${{ github.action_path }}/pyproject.toml
          ${{ github.action_path }}/uv.lock
        ignore-empty-workdir: true
        working-directory: "${{ github.action_path }}"

    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Assemble site from all live branches
      id: assemble
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        uv run --frozen godoctopus.py amalgamate
      env:
        DEBUG: ${{ runner.debug }}
        GITHUB_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        WORKFLOW_NAME: ${{ inputs.workflow_name }}
        ARTIFACT_NAME: ${{ inputs.artifact_name }}
        BRANCHES_TITLE: ${{ inputs.branches_title }}
        WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    - name: Upload pages artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: ${{ steps.assemble.outputs.path }}

    # deploy-pages sometimes doesn't find the artifact uploaded just before it,
    # and fails with 'No artifacts named "github-pages" were found':
    # https://github.com/actions/deploy-pages/issues/451
    # Re-running the job can't recover from it, because the re-run uploads a
    # second artifact with the same name. So retry the deploy step here, after
    # waiting longer each time. The lookup happens before the deployment is
    # created, so a failed lookup leaves nothing behind.
    - name: Deploy to GitHub Pages
      id: deploy-1
      uses: actions/deploy-pages@v5
      continue-on-error: true

    - name: Wait before retrying the deploy
      if: steps.deploy-1.outcome == 'failure'
      shell: bash
      run: sleep 10

    - name: Deploy to GitHub Pages (retry 1)
      id: deploy-2
      if: steps.deploy-1.outcome == 'failure'
      uses: actions/deploy-pages@v5
      continue-on-error: true

    - name: Wait before retrying the deploy again
      if: steps.deploy-2.outcome == 'failure'
      shell: bash
      run: sleep 60

    - name: Deploy to GitHub Pages (retry 2)
      if: steps.deploy-2.outcome == 'failure'
      uses: actions/deploy-pages@v5

    - name: Update build statuses
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        uv run --frozen godoctopus.py update-status
      env:
        DEBUG: ${{ runner.debug }}
        GITHUB_TOKEN: ${{ github.token }}
        COMMENT: ${{ inputs.comment }}
        COMMENT_TEMPLATE: ${{ inputs.comment_template }}
